{% extends 'base.html' %}
{% block title %}Restaurar clave de admin{% endblock %}
{% block content %}
<div style="max-width:620px;margin:3rem auto">
  <div class="card">
    <h1>Restaurar clave de admin</h1>
    <p class="muted">Esta acción no elimina grupos, estudiantes ni notas. Solo cambia la clave de la cuenta admin a <strong>admin123</strong>.</p>
    <form method="post">
      <label>Confirmación<input name="confirmation" placeholder="RESTABLECER ADMIN" required></label>
      <div class="actions"><button class="danger">Restaurar clave</button><a class="button secondary" href="{{ url_for('login') }}">Volver al acceso</a></div>
    </form>
  </div>
</div>
{% endblock %}
