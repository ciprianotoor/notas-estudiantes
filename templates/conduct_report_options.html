{% extends "base.html" %}{% block title %}Reporte de Conducta{% endblock %}{% block content %}
<div class="page-heading"><p class="eyebrow">REPORTE PARA LA FAMILIA</p><h1>Reporte de Conducta</h1><p class="muted">{{ student.name }} · {{ student.code }}</p></div>
<form method="get" action="{{ url_for('conduct_report_pdf', student_id=student.id) }}" class="card"><h2>Tipo de reporte</h2><label><input type="radio" name="detail" value="detailed" checked> Detallado: criterios, observaciones e incidencias</label><label><input type="radio" name="detail" value="general"> General: resumen de resultados</label><h2>Parciales que se incluirán</h2>{% for p in range(1,5) %}<label><input type="checkbox" name="partial" value="{{ p }}" checked> {{ partial_name(p) }}</label>{% endfor %}<div class="actions"><button>Generar PDF para firma</button><a class="button secondary" href="{{ url_for('grades', student_id=student.id) }}">Cancelar</a></div></form>{% endblock %}
