name: Instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Construir instalador
        shell: powershell
        run: .\build_windows.ps1

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NotasEstudiantes-Setup
          path: installer/NotasEstudiantes-Setup.exe
          if-no-files-found: error

      - name: Crear Release con instalador
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/NotasEstudiantes-Setup.exe
